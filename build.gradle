plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'com.echobroadcast'
version = '1.0.0-dev'
base { archivesName = 'beyondthebag' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods { beyondthebag { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories { mavenCentral() }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
}

processResources {
    def replaceProperties = [mod_id: 'beyondthebag', mod_name: 'Beyond the Bag', mod_version: project.version,
                             mod_authors: 'EchoBroadcast', mod_description: 'A mysterious bag containing persistent pocket spaces and unstable expeditions.']
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand replaceProperties }
}

jar {
    manifest {
        attributes([
                'Specification-Title': 'beyondthebag',
                'Specification-Vendor': 'EchoBroadcast',
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': 'EchoBroadcast'
        ])
    }
}
jar.finalizedBy('reobfJar')
